<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Listing Page</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

    <section class="banner">
      <h1>Our Products</h1>
      <p>Explore the latest gadgets at best prices</p>
    </section>

    <main class="product-grid">

        <div class="product-card">
            <img src="sw.webp" alt="Product 1">
            <h3>Smart Watch</h3>
            <p class="price">₹2,999</p>
        </div>

        <div class="product-card">
            <img src="hp.webp" alt="Product 2">
            <h3>Headphones</h3>
            <p class="price">₹1,499</p>
        </div>

        <div class="product-card">
            <img src="ws.jpg" alt="Product 3">
            <h3>Wireless Speaker</h3>
            <p class="price">₹2,199</p>
        </div>

        <div class="product-card">
            <img src="fb.jpg" alt="Product 4">
            <h3>Fitness Band</h3>
            <p class="price">₹999</p>
        </div>

        <div class="product-card">
            <img src="bt.webp" alt="Product 5">
            <h3>Bluetooth Mouse</h3>
            <p class="price">₹799</p>
        </div>

        <div class="product-card">
            <img src="ls.jpg" alt="Product 6">
            <h3>Laptop Stand</h3>
            <p class="price">₹1,299</p>
        </div>

    </main>

</body>
</html>
